server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Blazor WebAssembly is a single-page app: deep links such as /command-stream must fall back to index.html,
    # otherwise refreshing the browser on any page other than "/" would return a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # appsettings.json is rewritten at container start (see docker/40-write-appsettings.sh) — never cache it.
    location = /appsettings.json {
        add_header Cache-Control "no-store";
    }
}
