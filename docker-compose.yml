services:
  smartx-api:
    build:
      context: .
      dockerfile: src/SmartX.Api/Dockerfile
    container_name: smartx-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - smartx-uploads:/app/wwwroot/uploads

  smartx-client:
    build:
      context: .
      dockerfile: src/SmartX.Client/Dockerfile
    container_name: smartx-client
    ports:
      - "8081:80"
    environment:
      # The Blazor app runs in your browser, so this must be the host-visible API address.
      - API_BASE_URL=http://localhost:8080
    depends_on:
      - smartx-api

  # Optional: a separate fleet of fake devices that POSTs to the API over HTTP.
  #   docker compose --profile simulator up --build
  smartx-simulator:
    profiles: ["simulator"]
    build:
      context: .
      dockerfile: src/SmartX.DeviceSimulator/Dockerfile
    container_name: smartx-simulator
    command: ["--api", "http://smartx-api:8080", "--devices", "4", "--interval", "1000"]
    depends_on:
      - smartx-api

volumes:
  smartx-uploads:
